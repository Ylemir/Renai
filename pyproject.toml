[project]
name = "renai"
version = "0.1.1"
description = "AI based image renaming CLI"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Ylemir", email = "ylem.he@139.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: Multimedia :: Graphics"
]
keywords = ["ai", "image", "renaming", "openai", "cli"]
requires-python = ">=3.12"
dependencies = [
    "openai>=2.14.0",
    "pillow>=12.0.0",
    "toml>=0.10.2",
    "typer>=0.20.1",
]

[project.urls]
Homepage = "https://github.com/Ylemir/Renai"
Repository = "https://github.com/Ylemir/Renai.git"
Issues = "https://github.com/Ylemir/Renai/issues"

[project.scripts]
renai = "renai.cli:app"

[build-system]
requires = ["uv_build>=0.9.21"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.17.0",
    "ruff>=0.14.10",
]

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true
unsafe-fixes = false

[tool.ruff.lint]
select = [
  "F",    # Pyflakes
  "E", "W",  # PEP8
  "I",    # isort
  "B",    # flake8-bugbear
  "SIM",  # Simplify code
  "C4",   # Comprehensions
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
